[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-test-lab"
version = "1.1.0"
description = "Reproducible vulnerable-vs-protected OWASP GenAI LLM Top 10 laboratory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "matgasp" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=5,<8"]
audit = ["pip-audit>=2.10,<3"]

[project.scripts]
prompt-injection-lab = "llm_lab.cli:main"

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.setuptools.package-data]
llm_lab = ["data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
