name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
          
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade "pip>=26.2.1,<27"

      - name: Install
        run: python -m pip install -e ".[test,audit]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Prove vulnerable versus protected behavior
        run: python -m llm_lab demo

      - name: Test with coverage
        run: python -m pytest --cov=llm_lab --cov-report=term-missing --cov-fail-under=90

      - name: Audit dependencies
        run: python -m pip_audit --skip-editable
